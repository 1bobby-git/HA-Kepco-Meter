name: Fix grouped sensor mypy

on:
  push:
    branches:
      - feature/five-sensor-devices
    paths:
      - .github/workflows/fix-mypy.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # source: actions/checkout@v7
        with:
          ref: feature/five-sensor-devices
          fetch-depth: 0
      - name: Fix device customer key typing and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("custom_components/kepco_on/sensor.py")
          source = path.read_text(encoding="utf-8")
          old = '''    device_registry = dr.async_get(hass)
              for device_entry in dr.async_entries_for_config_entry(device_registry, entry.entry_id):
                  customer_key = _customer_key_from_device_identifiers(device_entry.identifiers)
                  if customer_key is None or customer_key in selected_keys:
                      continue
                  if set(device_entry.config_entries) == {entry.entry_id}:
                      device_registry.async_remove_device(device_entry.id)
          '''
          new = '''    device_registry = dr.async_get(hass)
              for device_entry in dr.async_entries_for_config_entry(device_registry, entry.entry_id):
                  device_customer_key = _customer_key_from_device_identifiers(device_entry.identifiers)
                  if device_customer_key is None or device_customer_key in selected_keys:
                      continue
                  if set(device_entry.config_entries) == {entry.entry_id}:
                      device_registry.async_remove_device(device_entry.id)
          '''
          if old not in source:
              raise SystemExit("expected sensor cleanup block was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          rm -f .github/workflows/fix-mypy.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: separate entity and device customer keys"
          git push origin HEAD:feature/five-sensor-devices
