name: Apply v0.3.11 legacy session recovery

on:
  push:
    branches:
      - fix/legacy-session-recovery-0.3.11

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v0311-autofix]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v5

      - name: Apply recovery patch
        run: python scripts/apply_v0311_recovery.py

      - name: Format changed Python files
        run: |
          python -m pip install ruff==0.16.5
          python -m ruff format custom_components/kepco_on tests
          python -m ruff check --fix custom_components/kepco_on tests

      - name: Remove one-time patch machinery
        run: |
          rm scripts/apply_v0311_recovery.py
          rm .github/workflows/tmp-v0311-recovery.yml

      - name: Commit recovery patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: recover legacy KEPCO ON sessions [v0311-autofix]"
          git push
