name: Migrate local brand assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/migrate-local-brand-assets.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"

      - name: Install image tools
        shell: bash
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build local KEPCO ON brand assets
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          curl --fail --location --retry 5 --retry-all-errors \
            --user-agent "Mozilla/5.0 (Home Assistant KEPCO ON brand migration)" \
            "https://online.kepco.co.kr/cm/images/img-navi-logo.png" \
            --output "${tmp}/source.png"
          test "$(head -c 8 "${tmp}/source.png" | od -An -tx1 | tr -d ' \n')" = "89504e470d0a1a0a"
          python - "${tmp}/source.png" <<'PY'
          from pathlib import Path
          from PIL import Image
          import sys

          source_path = Path(sys.argv[1])
          target = Path("custom_components/kepco_on/brand")
          target.mkdir(parents=True, exist_ok=True)
          source = Image.open(source_path).convert("RGBA")

          red_points = []
          for y in range(source.height):
              for x in range(source.width):
                  r, g, b, a = source.getpixel((x, y))
                  if min(r, g, b) >= 238 and max(r, g, b) - min(r, g, b) <= 16:
                      source.putpixel((x, y), (r, g, b, 0))
                  elif r >= 175 and g <= 110 and b <= 125 and r > g * 1.7 and r > b * 1.5:
                      red_points.append((x, y))

          full_bbox = source.getchannel("A").getbbox()
          if full_bbox is None:
              raise SystemExit("KEPCO ON logo became fully transparent")
          full = source.crop(full_bbox)

          def save_logo(height: int, name: str) -> None:
              width = round(full.width * height / full.height)
              image = full.resize((width, height), Image.Resampling.LANCZOS)
              image.save(target / name, format="PNG", optimize=True)

          save_logo(158, "logo.png")
          save_logo(316, "logo@2x.png")

          if not red_points:
              raise SystemExit("Could not locate the red KEPCO ON mark")
          min_x = min(x for x, _ in red_points)
          max_x = max(x for x, _ in red_points)
          red_width = max_x - min_x + 1
          split_x = min_x + round(red_width * 0.53)
          o_points = [(x, y) for x, y in red_points if x <= split_x]
          if not o_points:
              raise SystemExit("Could not isolate the KEPCO ON O mark")
          ox0 = max(0, min(x for x, _ in o_points) - 6)
          oy0 = max(0, min(y for _, y in o_points) - 6)
          ox1 = min(source.width, max(x for x, _ in o_points) + 7)
          oy1 = min(source.height, max(y for _, y in o_points) + 7)
          mark = source.crop((ox0, oy0, ox1, oy1))

          def save_icon(size: int, name: str) -> None:
              inner = round(size * 0.92)
              image = mark.copy()
              image.thumbnail((inner, inner), Image.Resampling.LANCZOS)
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              canvas.alpha_composite(image, ((size - image.width) // 2, (size - image.height) // 2))
              canvas.save(target / name, format="PNG", optimize=True)

          save_icon(256, "icon.png")
          save_icon(512, "icon@2x.png")
          PY

      - name: Bump version and release notes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          path = Path("custom_components/kepco_on/manifest.json")
          manifest = json.loads(path.read_text(encoding="utf-8"))
          manifest["version"] = "0.2.1"
          path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          cat > RELEASE_NOTES.md <<'MD'
          ## KEPCO ON v0.2.1

          ### Home Assistant 로컬 브랜드 이미지

          - `custom_components/kepco_on/brand/`에 한전ON 기본 아이콘과 전체 로고를 포함했습니다.
          - `icon.png`는 한전ON의 빨간색 O 심볼을 사용하며 256×256 투명 PNG입니다.
          - `icon@2x.png`는 512×512 고해상도 투명 PNG입니다.
          - `logo.png`와 `logo@2x.png`는 전체 한전ON 로고이며 배경과 불필요한 여백을 제거했습니다.
          - Home Assistant 2026.3 이상에서는 로컬 Brands Proxy API가 이 이미지를 기존 Brands CDN보다 우선 사용합니다.

          센서, 로그인, 요금 계산 및 데이터 파싱 동작 변경은 없습니다.
          MD

      - name: Validate generated assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path("custom_components/kepco_on/brand")
          expected = {"icon.png": (256, 256), "icon@2x.png": (512, 512), "logo.png": None, "logo@2x.png": None}
          for name, size in expected.items():
              with Image.open(root / name) as image:
                  image.load()
                  if image.format != "PNG" or image.mode != "RGBA":
                      raise SystemExit(f"Invalid image format/mode: {name} {image.format} {image.mode}")
                  if size is not None and image.size != size:
                      raise SystemExit(f"Invalid size: {name} {image.size}")
                  if image.getchannel("A").getextrema()[0] != 0:
                      raise SystemExit(f"Missing transparency: {name}")
                  if "logo" in name:
                      short = min(image.size)
                      low, high = ((256, 512) if "@2x" in name else (128, 256))
                      if not low <= short <= high:
                          raise SystemExit(f"Invalid logo short side: {name} {short}")
          PY
          git diff --check

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/migrate-local-brand-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            custom_components/kepco_on/manifest.json \
            custom_components/kepco_on/brand \
            RELEASE_NOTES.md \
            .github/workflows/migrate-local-brand-assets.yml
          git commit -m "Migrate KEPCO ON to local brand assets"
          git push origin HEAD:main
