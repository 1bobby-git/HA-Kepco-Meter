name: Reapply KEPCO ON local brand icon

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reapply-local-brand-icon.yml

permissions:
  contents: write

concurrency:
  group: reapply-kepco-on-local-brand-icon
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare latest branch state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B local-brand-release origin/main

      - name: Install image tooling
        shell: bash
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Apply final KEPCO ON icons
        shell: bash
        run: |
          set -euo pipefail
          source_base="https://raw.githubusercontent.com/1bobby-git/brands/4620f91aab78031a7b99749c97ff8f7748fd35c5/custom_integrations/kepco_on"
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT

          curl --fail --location --retry 3 --retry-delay 2 "${source_base}/icon.png" --output "${tmp}/icon.png"
          curl --fail --location --retry 3 --retry-delay 2 "${source_base}/icon@2x.png" --output "${tmp}/icon@2x.png"

          python - "${tmp}/icon.png" "${tmp}/icon@2x.png" <<'PY'
          from pathlib import Path
          from PIL import Image
          import sys

          for raw_path, expected in ((sys.argv[1], (256, 256)), (sys.argv[2], (512, 512))):
              path = Path(raw_path)
              image = Image.open(path).convert("RGBA")
              if image.size != expected:
                  raise SystemExit(f"Unexpected size for {path}: {image.size}")
              if image.getchannel("A").getextrema() != (0, 255):
                  raise SystemExit(f"Missing transparency in {path}")
              image.save(path, format="PNG", optimize=True, compress_level=9)
          PY

          install -m 0644 "${tmp}/icon.png" custom_components/kepco_on/brand/icon.png
          install -m 0644 "${tmp}/icon@2x.png" custom_components/kepco_on/brand/icon@2x.png

          python - <<'PY'
          from pathlib import Path

          old = "0.2.3"
          new = "0.2.4"
          paths = [
              Path("custom_components/kepco_on/manifest.json"),
              Path("pyproject.toml"),
              Path("tests/test_ci_metadata.py"),
              Path("RELEASE_NOTES.md"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected {old} in {path}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          notes_path = Path("RELEASE_NOTES.md")
          notes = notes_path.read_text(encoding="utf-8")
          marker = "### 기본 아이콘 표시 개선\n\n"
          addition = (
              "- 확정된 한전ON O 심볼을 컴포넌트 내부 로컬 브랜드 자산으로 다시 적용했습니다.\n"
              "- Home Assistant Brands Proxy API와 HACS 설치 패키지가 동일한 256px·512px 투명 PNG를 사용합니다.\n"
          )
          if addition not in notes:
              if marker not in notes:
                  raise SystemExit("Release notes icon section was not found")
              notes = notes.replace(marker, marker + addition, 1)
              notes_path.write_text(notes, encoding="utf-8")
          PY

          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          import tomllib

          expected = {
              Path("custom_components/kepco_on/brand/icon.png"): (256, 256),
              Path("custom_components/kepco_on/brand/icon@2x.png"): (512, 512),
          }
          for path, size in expected.items():
              image = Image.open(path).convert("RGBA")
              if image.size != size:
                  raise SystemExit(f"Unexpected size for {path}: {image.size}")
              if image.getchannel("A").getextrema() != (0, 255):
                  raise SystemExit(f"Missing transparency in {path}")

          manifest = json.loads(Path("custom_components/kepco_on/manifest.json").read_text(encoding="utf-8"))
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          if manifest.get("version") != "0.2.4" or project["project"]["version"] != "0.2.4":
              raise SystemExit("KEPCO ON version surfaces are not synchronized")
          PY

          git diff --check
          python -m compileall -q custom_components/kepco_on

      - name: Commit local brand release
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/reapply-local-brand-icon.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reapply KEPCO ON local brand icon for 0.2.4"
          git push origin HEAD:main
