name: Complete verified optimization release
"on":
  push:
    branches: [release/optimization-20260906]
    paths: [.github/workflows/complete-optimization-20260906.yml]
permissions:
  contents: write
concurrency:
  group: deploy-optimization-20260906
  cancel-in-progress: false
jobs:
  validate-and-publish:
    if: github.repository == '1bobby-git/HA-Kepco-Meter'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # source: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Read pinned original publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # source: actions/checkout@v7
        with:
          repository: 1bobby-git/HA-iOS-ANCS
          ref: d5c58703029ea8cfbff4cfd335c59fc49d3fbe98
          path: .legacy-helper
          sparse-checkout: .optimization-release
          persist-credentials: false
      - name: Read pinned publisher correction
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # source: actions/checkout@v7
        with:
          repository: 1bobby-git/HA-iOS-ANCS
          ref: 2c406f1bf81628b291c382935854170eb8c023c2
          path: .release-helper
          sparse-checkout: .optimization-release
          persist-credentials: false
      - name: Read pinned approved patch specification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # source: actions/checkout@v7
        with:
          ref: 44745c337565d1bb8da8511545df367e0c5f503c
          path: .release-input
          sparse-checkout: .github/workflows
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # source: actions/setup-python@v7
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Prepare isolated publisher and exact patch specification
        run: |
          cp .legacy-helper/.optimization-release/deploy.py "$RUNNER_TEMP/optimization-deploy.py"
          python .release-helper/.optimization-release/repair_helper_v3.py "$RUNNER_TEMP/optimization-deploy.py"
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          text = Path('.release-input/.github/workflows/deploy-optimization-20260906.yml').read_text()
          matches = re.findall(r'^        (\{"repository".*\})$', text, re.M)
          assert len(matches) == 1
          spec = json.loads(matches[0])
          assert spec['repository'] == os.environ['GITHUB_REPOSITORY']
          assert spec['base_version'] == '0.3.3' and spec['candidate_version'] == '0.3.4'
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('PATCH_SPEC=' + json.dumps(spec, ensure_ascii=True) + '\n')
          PY
          rm -rf .legacy-helper .release-helper .release-input
      - name: Check current source, versions and branch protections
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/optimization-deploy.py" check
      - name: Install locked Python test dependencies
        run: python -m pip install -r requirements_test.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # source: actions/setup-node@v7
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci
      - run: npm run test:login-schema
      - run: npm audit --audit-level=moderate
      - name: Validate unchanged source with every native gate
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy
          python -m pytest tests/test_ci_metadata.py
          python -m pytest --cov=custom_components.kepco_on --cov-report=term-missing --cov-fail-under=95 --junitxml="$RUNNER_TEMP/optimization-baseline.xml"
      - name: Apply exact bounded-read patch and update documentation
        run: python "$RUNNER_TEMP/optimization-deploy.py" apply
      - name: Synchronize release metadata and preserve documented compatibility
        run: |
          python - <<'PY'
          import json, os, subprocess, tomllib
          from pathlib import Path
          state_path = Path(os.environ['RUNNER_TEMP']) / 'optimization-state.json'
          state = json.loads(state_path.read_text())
          updates = [
              ('pyproject.toml', '310209da103e73e686c148beacad04cade4bc197', 'version = "0.3.3"', 'version = "0.3.4"'),
              ('README.md', 'b868e5a8fde5c1c128861b3823b071a50607276f', '- 버전: `v0.3.3`.', '- 버전: `v0.3.4`.'),
          ]
          for name, expected, old, new in updates:
              assert subprocess.check_output(['git', 'rev-parse', 'HEAD:' + name], text=True).strip() == expected, name
              p = Path(name)
              text = p.read_text()
              assert text.count(old) == 1, name
              p.write_text(text.replace(old, new))
              state['paths'].append(name)
          assert tomllib.loads(Path('pyproject.toml').read_text())['project']['version'] == '0.3.4'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD:RELEASE_NOTES.md'], text=True).strip() == 'da3b0bf9f4f3b49881877a98c339bbea3913c7c5'
          notes = '''## 한전ON v0.3.4

          ### HTTP 응답 처리 안정성 개선

          - 나뉘어 수신되는 로그인 준비 페이지와 JSON 본문을 EOF까지 읽어 일부 응답을 전체 응답으로 오인하지 않도록 수정했습니다.
          - 기존 응답 크기 제한 2 MiB, 호스트·경로 허용 목록, 인증·재시도 정책을 유지합니다.
          - manifest, 런타임 상수, pyproject와 README의 버전을 0.3.4로 동기화했습니다.

          ### 기존 호환성 유지

          - 기존 주택용 직접계약 호환성 개선을 유지합니다.
          - 기존 주택용 파서 안정성 보강을 유지합니다.
          - 로그인 응답의 선택 token 필드 처리, 필수 필드 검증과 오류 진단을 유지합니다.
          - 최소 Home Assistant 버전은 2026.8.3입니다.

          ### 검증과 업데이트

          변경 전후 전체 저장소 테스트, Ruff·mypy·CI 메타데이터, 95% 커버리지 기준, 로그인 스키마 테스트 및 HACS·Hassfest를 확인합니다.
          분할 응답·빈 응답·제한 경계·초과·타임아웃·취소의 회귀 테스트를 추가했습니다.
          실제 계정 로그인과 운영 HA 설치는 이 배포에서 수행하지 않았습니다.
          변경·검증 범위와 롤백: [최적화 문서](docs/OPTIMIZATION_2026-09-06.md).
          '''
          import textwrap
          Path('RELEASE_NOTES.md').write_text(textwrap.dedent(notes).replace('\n          ', '\n').rstrip() + '\n')
          state['paths'].append('RELEASE_NOTES.md')
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n')
          PY
      - name: Add bounded response regressions to the native test suite
        run: |
          cat > tests/test_bounded_response.py <<'PY'
          """Regression coverage for bounded reads of split HTTP response bodies."""

          from __future__ import annotations

          import asyncio
          from typing import cast
          from unittest.mock import AsyncMock, MagicMock, call

          from aiohttp import ClientResponse
          import pytest

          from custom_components.kepco_on import api
          from custom_components.kepco_on.exceptions import KepcoOnProtocolError


          @pytest.mark.parametrize(
              ("chunks", "expected"),
              [
                  ((b"",), b""),
                  ((b"a", b"bc", b""), b"abc"),
                  ((b"{", b'"ok":', b"true}", b""), b'{"ok":true}'),
              ],
          )
          async def test_split_response_reads_through_eof(
              chunks: tuple[bytes, ...], expected: bytes
          ) -> None:
              response = MagicMock(spec=ClientResponse)
              response.content.read = AsyncMock(side_effect=chunks)
              result = await api._read_bounded_body(cast("ClientResponse", response))
              assert result == expected
              assert response.content.read.await_count == len(chunks)


          async def test_exact_limit_is_accepted(monkeypatch: pytest.MonkeyPatch) -> None:
              monkeypatch.setattr(api, "MAX_RESPONSE_BYTES", 4)
              response = MagicMock(spec=ClientResponse)
              response.content.read = AsyncMock(side_effect=[b"ab", b"cd", b""])
              assert await api._read_bounded_body(cast("ClientResponse", response)) == b"abcd"
              assert response.content.read.await_args_list == [call(5), call(3), call(1)]


          async def test_overflow_keeps_original_safe_reason(monkeypatch: pytest.MonkeyPatch) -> None:
              monkeypatch.setattr(api, "MAX_RESPONSE_BYTES", 4)
              response = MagicMock(spec=ClientResponse)
              response.content.read = AsyncMock(side_effect=[b"abcd", b"e"])
              with pytest.raises(KepcoOnProtocolError, match="login bootstrap response was too large"):
                  await api._read_bounded_body(
                      cast("ClientResponse", response),
                      error_reason="login bootstrap response was too large",
                  )
              assert response.content.read.await_args_list == [call(5), call(1)]


          @pytest.mark.parametrize("error_type", [TimeoutError, asyncio.CancelledError])
          async def test_transport_failure_and_cancellation_propagate(
              error_type: type[BaseException],
          ) -> None:
              response = MagicMock(spec=ClientResponse)
              response.content.read = AsyncMock(side_effect=error_type)
              with pytest.raises(error_type):
                  await api._read_bounded_body(cast("ClientResponse", response))
              response.content.read.assert_awaited_once()
          PY
          python -m ruff check --select I --fix tests/test_bounded_response.py
          python -m ruff format custom_components/kepco_on/api.py tests/test_bounded_response.py
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'optimization-state.json'
          state = json.loads(path.read_text())
          state['paths'] = sorted(set(state['paths']) | {'tests/test_bounded_response.py'})
          path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n')
          PY
          git diff --check
      - name: Validate patched source with every native gate
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy
          python -m pytest tests/test_ci_metadata.py
          python -m pytest --cov=custom_components.kepco_on --cov-report=term-missing --cov-fail-under=95 --junitxml="$RUNNER_TEMP/optimization-patched.xml"
          npm run test:login-schema
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # source: hacs/action@main
        with:
          category: integration
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # source: home-assistant/actions/hassfest@master
      - name: Publish tested source, version tag and verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/optimization-deploy.py" publish
      - name: Preserve validation and publication evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optimization-validation
          path: |
            ${{ runner.temp }}/optimization-baseline.xml
            ${{ runner.temp }}/optimization-patched.xml
            ${{ runner.temp }}/optimization-result.json
          if-no-files-found: error
