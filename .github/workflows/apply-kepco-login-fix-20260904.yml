name: Verify KEPCO login compatibility patch

on:
  push:
    branches:
      - diagnostic/kepco-login-20260904

permissions:
  contents: write

jobs:
  verify:
    name: Test and publish fix branch
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out staged transformer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # source: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: patch-source
          persist-credentials: false

      - name: Check out exact main snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # source: actions/checkout@v7
        with:
          ref: 552425f32202eec1cf161685ddeede82f221c64b
          fetch-depth: 0
          path: repo

      - name: Apply deterministic source transformation
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode patch-source/.github/diagnostics/apply-kepco-login-fix.py.gz.b64 \
            | gzip -dc > /tmp/apply-kepco-login-fix.py
          echo "d640b155706e40eddff0de26b4c67c52be14e37c11de8523d2a98c61ea8917d2  /tmp/apply-kepco-login-fix.py" \
            | sha256sum --check --strict
          cd repo
          git checkout -B fix/kepco-login-response-compat-20260904
          python /tmp/apply-kepco-login-fix.py
          sed -i '/^최소 Home Assistant 버전/i\- 기존 `v0.3.2`의 주택용 직접계약 호환성 개선은 그대로 유지됩니다.\
- 기존 `v0.3.2`의 주택용 파서 안정성 보강도 그대로 유지됩니다.\' RELEASE_NOTES.md
          git diff --check
          git diff --stat

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # source: actions/setup-python@v7
        with:
          python-version: "3.14.4"
          cache: pip
          cache-dependency-path: repo/requirements_test.txt

      - name: Install Python dependencies
        working-directory: repo
        run: python -m pip install -r requirements_test.txt

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # source: actions/setup-node@v7
        with:
          node-version: "24.20.0"
          cache: npm
          cache-dependency-path: repo/package-lock.json

      - name: Install Node dependencies
        working-directory: repo
        run: npm ci

      - name: Run Node login-schema tests
        working-directory: repo
        run: npm run test:login-schema

      - name: Audit Node dependencies
        working-directory: repo
        run: npm audit --audit-level=moderate

      - name: Format changed Python source
        working-directory: repo
        run: python -m ruff format .

      - name: Lint
        working-directory: repo
        run: python -m ruff check .

      - name: Type check
        working-directory: repo
        run: python -m mypy

      - name: Validate JSON, YAML, and version metadata
        working-directory: repo
        run: python -m pytest tests/test_ci_metadata.py tests/test_version_metadata.py

      - name: Run Python tests with coverage
        working-directory: repo
        run: python -m pytest --cov=custom_components.kepco_on --cov-report=term-missing --cov-fail-under=95

      - name: Commit, package, and publish verified fix branch
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            README.md \
            RELEASE_NOTES.md \
            custom_components/kepco_on/auth.py \
            custom_components/kepco_on/config_flow.py \
            custom_components/kepco_on/const.py \
            custom_components/kepco_on/manifest.json \
            custom_components/kepco_on/strings.json \
            custom_components/kepco_on/translations/en.json \
            custom_components/kepco_on/translations/ko.json \
            pyproject.toml \
            tests/test_auth.py \
            tests/test_config_flow.py \
            tests/test_version_metadata.py
          expected_files="$(printf '%s\n' \
            README.md \
            RELEASE_NOTES.md \
            custom_components/kepco_on/auth.py \
            custom_components/kepco_on/config_flow.py \
            custom_components/kepco_on/const.py \
            custom_components/kepco_on/manifest.json \
            custom_components/kepco_on/strings.json \
            custom_components/kepco_on/translations/en.json \
            custom_components/kepco_on/translations/ko.json \
            pyproject.toml \
            tests/test_auth.py \
            tests/test_config_flow.py \
            tests/test_version_metadata.py | sort)"
          actual_files="$(git diff --cached --name-only | sort)"
          test "$actual_files" = "$expected_files"
          git commit -m "fix: tolerate optional KEPCO login token"
          git archive \
            --format=zip \
            --prefix=custom_components/kepco_on/ \
            --output="../kepco_on-v0.3.3-rc.zip" \
            HEAD:custom_components/kepco_on
          unzip -t ../kepco_on-v0.3.3-rc.zip
          git push --force origin HEAD:refs/heads/fix/kepco-login-response-compat-20260904

      - name: Upload tested Home Assistant package
        uses: actions/upload-artifact@v4
        with:
          name: kepco_on-v0.3.3-rc
          path: kepco_on-v0.3.3-rc.zip
          retention-days: 7
