name: Apply final KEPCO ON icon

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-final-brand-icons.yml

permissions:
  contents: write

concurrency:
  group: apply-final-kepco-on-icon
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare latest branch state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B icon-release origin/main

      - name: Download and validate final icon
        shell: bash
        run: |
          set -euo pipefail
          source_base="https://raw.githubusercontent.com/1bobby-git/brands/464246d3df46c9426ec9dc6873a6f9561a326d2c/custom_integrations/kepco_on"
          tmp="$(mktemp -d)"
          echo "ICON_TMP=${tmp}" >> "${GITHUB_ENV}"
          curl --fail --location --retry 3 --retry-delay 2 "${source_base}/icon.png" --output "${tmp}/icon.png"
          curl --fail --location --retry 3 --retry-delay 2 "${source_base}/icon@2x.png" --output "${tmp}/icon@2x.png"
          python - "${tmp}/icon.png" 256 "${tmp}/icon@2x.png" 512 <<'PY'
          from pathlib import Path
          import struct
          import sys

          for raw_path, expected in zip(sys.argv[1::2], sys.argv[2::2], strict=True):
              path = Path(raw_path)
              size = int(expected)
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR":
                  raise SystemExit(f"Invalid PNG: {path}")
              width, height = struct.unpack(">II", data[16:24])
              if (width, height) != (size, size):
                  raise SystemExit(f"Unexpected size for {path}: {width}x{height}")
              color_type = data[25]
              if color_type not in {3, 6}:
                  raise SystemExit(f"PNG lacks alpha-capable color type: {path}")
              if color_type == 3 and b"tRNS" not in data:
                  raise SystemExit(f"Indexed PNG lacks transparency: {path}")
          PY

      - name: Apply icon and update release metadata
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 "${ICON_TMP}/icon.png" custom_components/kepco_on/brand/icon.png
          install -m 0644 "${ICON_TMP}/icon@2x.png" custom_components/kepco_on/brand/icon@2x.png

          python - <<'PY'
          from pathlib import Path

          old = "0.2.2"
          new = "0.2.3"
          for raw_path in (
              "custom_components/kepco_on/manifest.json",
              "pyproject.toml",
              "tests/test_ci_metadata.py",
          ):
              path = Path(raw_path)
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected version {old} in {path}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          notes_path = Path("RELEASE_NOTES.md")
          notes = notes_path.read_text(encoding="utf-8")
          old_heading = "## 한전ON v0.2.2"
          if not notes.startswith(old_heading):
              raise SystemExit("Unexpected RELEASE_NOTES.md heading")
          notes = notes.replace(old_heading, "## 한전ON v0.2.3", 1)
          brand_section = (
              "### 기본 아이콘 표시 개선\n\n"
              "- 한전ON O 심볼을 안전 여백이 확보된 정사각형 투명 PNG로 다시 적용했습니다.\n"
              "- HACS와 Home Assistant의 32px 축소 표시에서 우측이 잘려 보이지 않도록 구도를 조정했습니다.\n"
              "- `icon.png`는 256×256, `icon@2x.png`는 512×512 규격을 유지합니다.\n"
              "- 센서 데이터, 로그인 및 요금 계산 동작은 변경하지 않았습니다.\n\n"
          )
          notes = notes.replace("## 한전ON v0.2.3\n\n", "## 한전ON v0.2.3\n\n" + brand_section, 1)
          notes_path.write_text(notes, encoding="utf-8")
          PY

          rm -rf "${ICON_TMP}"
          git diff --check

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import struct

          manifest = json.loads(Path("custom_components/kepco_on/manifest.json").read_text(encoding="utf-8"))
          if manifest.get("version") != "0.2.3":
              raise SystemExit("Manifest version was not updated")
          pyproject = Path("pyproject.toml").read_text(encoding="utf-8")
          if not re.search(r'^version = "0\.2\.3"$', pyproject, re.MULTILINE):
              raise SystemExit("pyproject version was not updated")
          for name, expected in (("icon.png", 256), ("icon@2x.png", 512)):
              data = Path("custom_components/kepco_on/brand", name).read_bytes()
              if struct.unpack(">II", data[16:24]) != (expected, expected):
                  raise SystemExit(f"Invalid committed dimensions: {name}")
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-final-brand-icons.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update KEPCO ON default icon for 0.2.3"
          git push origin HEAD:main
