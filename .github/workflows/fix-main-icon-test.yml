name: Fix main icon metadata test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-main-icon-test.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # source: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Accept transparent indexed PNG and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_ci_metadata.py")
          source = path.read_text(encoding="utf-8")
          old = '''def test_hacs_brand_icon_is_square_rgba_png() -> None:
              icon = ROOT / "custom_components" / "kepco_on" / "brand" / "icon.png"
              data = icon.read_bytes()

              assert data.startswith(b"\\x89PNG\\r\\n\\x1a\\n")
              assert data[12:16] == b"IHDR"
              assert struct.unpack(">II", data[16:24]) == (256, 256)
              assert data[25] == 6  # PNG color type 6: truecolor with alpha
          '''
          new = '''def test_hacs_brand_icon_is_square_transparent_png() -> None:
              icon = ROOT / "custom_components" / "kepco_on" / "brand" / "icon.png"
              data = icon.read_bytes()

              assert data.startswith(b"\\x89PNG\\r\\n\\x1a\\n")
              assert data[12:16] == b"IHDR"
              assert struct.unpack(">II", data[16:24]) == (256, 256)
              color_type = data[25]
              assert color_type in {3, 6}  # indexed or truecolor with alpha
              if color_type == 3:
                  assert b"tRNS" in data
          '''
          if old not in source:
              raise SystemExit("expected PNG metadata test was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          rm -f .github/workflows/fix-main-icon-test.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "test: accept transparent indexed HACS icon"
          git push origin HEAD:main
