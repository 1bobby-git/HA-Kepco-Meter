name: Export clean-name branch source

on:
  push:
    branches:
      - fix/clean-device-names

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output=ha-kepco-meter-clean-names-source.zip HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ha-kepco-meter-clean-names-source
          path: ha-kepco-meter-clean-names-source.zip
          if-no-files-found: error
          retention-days: 1
