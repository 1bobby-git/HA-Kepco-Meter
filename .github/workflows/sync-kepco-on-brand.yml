name: Sync KEPCO ON brand assets

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-kepco-on-brand.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: true

      - name: Download and verify brand assets
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/1bobby-git/brands/e71de5adadf479a45b7b14a507d13177205d120c/custom_integrations/kepco_on"
          target="custom_components/kepco_on/brand"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$target"

          for name in icon.png icon@2x.png logo.png logo@2x.png; do
            curl --fail --location --retry 5 --retry-delay 3 --connect-timeout 20 "$base/$name" --output "$tmp/$name"
          done

          sha256sum --check --strict <<SUMS
          ed6a7810932b858f71aee1231229780f1ac682baa2db604cb83940844eb1638f  $tmp/icon.png
          8ae1cc6f247ca923376ecf84d3765322e31a85ede94218d12ae94329b2efa26e  $tmp/icon@2x.png
          f77db7ed9fbb5e203d5ed87180e2c3153083913873e7f750b1a055f800e79833  $tmp/logo.png
          6d4b2d148261af775b16d8d1db1f393b0bd9d397a37fd23310943aaa94a4152b  $tmp/logo@2x.png
          SUMS

          install -m 0644 "$tmp/icon.png" "$target/icon.png"
          install -m 0644 "$tmp/icon@2x.png" "$target/icon@2x.png"
          install -m 0644 "$tmp/logo.png" "$target/logo.png"
          install -m 0644 "$tmp/logo@2x.png" "$target/logo@2x.png"
          git diff --check

      - name: Commit synchronized assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/kepco_on/brand/icon.png custom_components/kepco_on/brand/icon@2x.png custom_components/kepco_on/brand/logo.png custom_components/kepco_on/brand/logo@2x.png
          if git diff --cached --quiet; then
            echo "KEPCO ON assets are already current."
            exit 0
          fi
          git commit -m "Add KEPCO ON brand assets"
          git push origin HEAD:main
