name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run Node tests
        run: npm run test:login-schema

      - name: Audit Node dependencies
        run: npm audit --audit-level=moderate

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy

      - name: Validate JSON and YAML
        run: python -m pytest tests/test_ci_metadata.py

      - name: Run Python tests with coverage
        run: python -m pytest --cov=custom_components.kepco_on --cov-report=term-missing --cov-fail-under=95
