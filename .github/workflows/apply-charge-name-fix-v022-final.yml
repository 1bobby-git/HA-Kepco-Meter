name: Apply v0.2.2 electricity charge names

on:
  push:
    branches:
      - fix/charge-entity-names-v022-final
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # source: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply v0.2.2 display-name fix
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent


          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise RuntimeError(
                      f"{path}: expected exactly one occurrence of {old!r}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")


          root = Path(".")

          replace_once(
              root / "custom_components/kepco_on/const.py",
              'VERSION = "0.2.1"',
              'VERSION = "0.2.2"',
          )
          replace_once(
              root / "custom_components/kepco_on/manifest.json",
              '"version": "0.2.1"',
              '"version": "0.2.2"',
          )
          replace_once(
              root / "pyproject.toml",
              'version = "0.2.1"',
              'version = "0.2.2"',
          )

          ko_path = root / "custom_components/kepco_on/translations/ko.json"
          ko_text = ko_path.read_text(encoding="utf-8")
          charge_names = (
              "전기요금 계",
              "전기요금 상세 기본요금",
              "전기요금 상세 전력량요금",
              "전기요금 상세 기후환경요금",
              "전기요금 상세 연료비조정요금",
              "전기요금 상세 출산가구할인요금",
          )
          for visible_name in charge_names:
              old = f'"name": "{visible_name}"'
              protected_name = visible_name.replace(
                  "전기요금 ", "전기요금\\u00a0", 1
              )
              new = f'"name": "{protected_name}"'
              if ko_text.count(old) != 1:
                  raise RuntimeError(
                      f"{ko_path}: expected exactly one occurrence of {old!r}"
                  )
              ko_text = ko_text.replace(old, new, 1)
          ko_path.write_text(ko_text, encoding="utf-8")

          readme_path = root / "README.md"
          readme = readme_path.read_text(encoding="utf-8")
          readme_replacements = (
              (
                  "- 버전: `v0.2.1`. 선택 세대마다",
                  "- 버전: `v0.2.2`. 선택 세대마다",
              ),
              (
                  "`0.2.1`의 `PERSISTED_COOKIE_ALLOWLIST`",
                  "`0.2.2`의 `PERSISTED_COOKIE_ALLOWLIST`",
              ),
              (
                  "금액 센서는 Home Assistant의 monetary device class 규칙에 맞춰",
                  "Home Assistant 기기 화면은 기기 이름과 같은 일반 공백 접두어를 "
                  "엔티티 이름에서 자동 생략할 수 있습니다. `v0.2.2`부터 전기요금 "
                  "엔티티는 위 표의 전체 이름이 그대로 표시되도록 처리합니다.\n\n"
                  "금액 센서는 Home Assistant의 monetary device class 규칙에 맞춰",
              ),
              (
                  "더 이상 사용하지 않는 `청구월` 단독 엔티티와 상세/CO₂ 생성 토글 옵션은 "
                  "마이그레이션 과정에서 정리됩니다. 업데이트 후",
                  "더 이상 사용하지 않는 `청구월` 단독 엔티티와 상세/CO₂ 생성 토글 옵션은 "
                  "마이그레이션 과정에서 정리됩니다. `v0.2.1`에서 `v0.2.2`로 업그레이드하면 "
                  "전기요금 기기의 10개 엔티티가 표의 전체 이름으로 표시됩니다. 기존 엔티티 "
                  "ID와 unique ID는 유지됩니다. 업데이트 후",
              ),
              (
                  "`0.2.1`은 `JSESSIONID`/`WMONID` 값을 저장하지 않습니다.",
                  "`0.2.2`에서도 `JSESSIONID`/`WMONID` 값을 저장하지 않습니다.",
              ),
              (
                  "매니페스트 버전 `0.2.1`, Git 태그 `v0.2.1`, GitHub 릴리스 제목과 "
                  "`kepco_on-v0.2.1.zip` 자산을 일치시킵니다.",
                  "매니페스트 버전 `0.2.2`, Git 태그 `v0.2.2`, GitHub 릴리스 제목과 "
                  "`kepco_on-v0.2.2.zip` 자산을 일치시킵니다.",
              ),
          )
          for old, new in readme_replacements:
              if readme.count(old) != 1:
                  raise RuntimeError(
                      f"{readme_path}: expected exactly one occurrence of {old!r}"
                  )
              readme = readme.replace(old, new, 1)
          readme_path.write_text(readme, encoding="utf-8")

          notes = dedent(
              """\
              ## 한전ON v0.2.2

              ### 전기요금 엔티티 이름 표시 수정

              Home Assistant 기기 화면이 기기 이름과 같은 접두어를 자동으로 생략하여
              `전기요금 계`가 `계`로, 일부 상세 요금 이름도 접두어 없이 표시되던 문제를 수정했습니다.
              표시 이름만 보정하며 센서 데이터와 계산 결과에는 영향을 주지 않습니다.

              `전기요금` 기기의 10개 엔티티는 다음 이름으로 표시됩니다.

              - 전기요금 계
              - 전기요금 상세 기본요금
              - 전기요금 상세 전력량요금
              - 전기요금 상세 기후환경요금
              - 전기요금 상세 연료비조정요금
              - 전기요금 상세 출산가구할인요금
              - 부가가치세
              - 전력기금
              - 원단위절사금액
              - 청구금액

              ### 호환성

              - 기존 엔티티 ID와 unique ID를 유지하므로 자동화와 대시보드 연결은 변경되지 않습니다.
              - 센서 값, `KRW` 단위, monetary device class는 변경하지 않았습니다.
              - 업데이트 후 Home Assistant Core를 완전히 재시작해야 새 표시 이름이 반영됩니다.

              최소 Home Assistant 버전은 2026.8.3입니다.
              """
          )
          (root / "RELEASE_NOTES.md").write_text(notes, encoding="utf-8")

          ci_path = root / "tests/test_ci_metadata.py"
          ci_text = ci_path.read_text(encoding="utf-8")
          ci_replacements = (
              (
                  'assert release_notes.startswith("## 한전ON v0.2.1\\n")',
                  'assert release_notes.startswith("## 한전ON v0.2.2\\n")',
              ),
              (
                  'assert "통합 허브 제목" in release_notes',
                  'assert "전기요금 계" in release_notes',
              ),
              (
                  'assert "센서 정보" in release_notes',
                  'assert "접두어" in release_notes',
              ),
              (
                  'assert release_version == Version("0.2.1")',
                  'assert release_version == Version("0.2.2")',
              ),
          )
          for old, new in ci_replacements:
              if ci_text.count(old) != 1:
                  raise RuntimeError(
                      f"{ci_path}: expected exactly one occurrence of {old!r}"
                  )
              ci_text = ci_text.replace(old, new, 1)
          ci_path.write_text(ci_text, encoding="utf-8")

          test_source = dedent(
              '''\
              """Korean electricity-charge display-name regression tests."""

              from __future__ import annotations

              import json
              from pathlib import Path
              from typing import Any, cast

              ROOT = Path(__file__).resolve().parents[1]
              DEVICE_NAME = "전기요금"
              NO_BREAK_SPACE = chr(0xA0)
              VISIBLE_NAMES = {
                  "electricity_subtotal": "전기요금 계",
                  "base_charge": "전기요금 상세 기본요금",
                  "energy_charge": "전기요금 상세 전력량요금",
                  "climate_environment_charge": "전기요금 상세 기후환경요금",
                  "fuel_adjustment_charge": "전기요금 상세 연료비조정요금",
                  "child_discount": "전기요금 상세 출산가구할인요금",
                  "vat": "부가가치세",
                  "power_industry_fund": "전력기금",
                  "rounding_amount": "원단위절사금액",
                  "amount_due": "청구금액",
              }
              PREFIXED_KEYS = frozenset(
                  {
                      "electricity_subtotal",
                      "base_charge",
                      "energy_charge",
                      "climate_environment_charge",
                      "fuel_adjustment_charge",
                      "child_discount",
                  }
              )


              def test_korean_charge_entity_names_remain_complete_on_device_page() -> None:
                  translations = cast(
                      "dict[str, Any]",
                      json.loads(
                          (
                              ROOT
                              / "custom_components"
                              / "kepco_on"
                              / "translations"
                              / "ko.json"
                          ).read_text(encoding="utf-8")
                      ),
                  )
                  sensors = cast(
                      "dict[str, dict[str, str]]",
                      translations["entity"]["sensor"],
                  )
                  actual = {key: sensors[key]["name"] for key in VISIBLE_NAMES}
                  visible_actual = {key: name.replace(NO_BREAK_SPACE, " ") for key, name in actual.items()}

                  assert visible_actual == VISIBLE_NAMES
                  protected_prefix = f"{DEVICE_NAME}{NO_BREAK_SPACE}"
                  for key in PREFIXED_KEYS:
                      assert actual[key].startswith(protected_prefix)
                      assert not actual[key].startswith(f"{DEVICE_NAME} ")
              '''
          )
          (root / "tests/test_charge_entity_names.py").write_text(
              test_source,
              encoding="utf-8",
          )
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve full electricity charge entity names"
          git push origin HEAD:${{ github.ref_name }}
