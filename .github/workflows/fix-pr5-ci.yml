name: Fix PR 5 CI

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: fix-pr5-ci
  cancel-in-progress: false

jobs:
  fix:
    name: Apply PR 5 CI cleanup
    runs-on: ubuntu-24.04

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # source: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Fix lint and release metadata assertions
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path("tests/test_ci_metadata.py")
          text = path.read_text(encoding="utf-8")

          old_assert = '                assert isinstance(item, str) and re.fullmatch(r"[0-9]{8}", item)\n'
          new_assert = (
              '                assert isinstance(item, str)\n'
              '                assert re.fullmatch(r"[0-9]{8}", item)\n'
          )
          if old_assert not in text:
              raise SystemExit("Expected composite fixture assertion was not found")
          text = text.replace(old_assert, new_assert, 1)

          old_notes = (
              '    assert release_notes.startswith("## 한전ON v0.2.4\\n")\n'
              '    assert "전기요금 계" in release_notes\n'
              '    assert "접두어" in release_notes\n'
          )
          new_notes = (
              '    assert release_notes.startswith("## 한전ON v0.3.1\\n")\n'
              '    assert "주택용 직접계약 지원" in release_notes\n'
              '    assert "파워플래너 사용량 센서 추가" in release_notes\n'
          )
          if old_notes not in text:
              raise SystemExit("Expected stale release-note assertions were not found")
          text = text.replace(old_notes, new_notes, 1)
          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_ci_metadata.py
          git commit -m "test: align v0.3.1 CI metadata checks"
          git push origin HEAD:main
