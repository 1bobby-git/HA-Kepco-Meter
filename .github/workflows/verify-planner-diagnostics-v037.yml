name: Verify planner diagnostics v0.3.7
on:
  push:
    branches:
      - work/kepco-diagnostics-v037-20260906
permissions:
  contents: write
concurrency:
  group: kepco-diagnostics-v037
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out patch sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: patch-source
          persist-credentials: false
      - name: Check out inspected baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1969da1b6ca0fd23555f1f1fdedb888d1ea79b70
          fetch-depth: 0
          path: repo
      - name: Prepare scoped changes
        shell: bash
        run: |
          set -euo pipefail
          cd repo
          git switch -c fix/kepco-planner-diagnostics-v0.3.7
          python ../patch-source/.maintenance/prepare_v037.py
          cp ../patch-source/.maintenance/test_planner_state_publication.py tests/
          cp ../patch-source/.maintenance/POWER_PLANNER_DIAGNOSTICS.md docs/
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/test_sensor.py')
          text = p.read_text(encoding='utf-8')
          old = '    for entity in successful:\n        is_planner = entity.entity_description.key in {\n            "current_period_usage",\n            "predicted_period_usage",\n        }\n        assert entity.available is not is_planner\n'
          assert text.count(old) == 1
          p.write_text(text.replace(old, '    assert {entity.available for entity in successful} == {True}\n'), encoding='utf-8')
          p = Path('tests/test_planner_state_publication.py')
          text = p.read_text(encoding='utf-8')
          old = '    coordinator.data.bills_by_customer_key[item.stable_key] = replace(\n        initial, current_period_usage_kwh=None, power_planner_status="no_data",\n        power_planner_return_code="90",\n    )'
          new = '    coordinator.data = replace(\n        coordinator.data,\n        bills_by_customer_key={item.stable_key: replace(\n            initial, current_period_usage_kwh=None, power_planner_status="no_data",\n            power_planner_return_code="90",\n        )},\n    )'
          assert text.count(old) == 1
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: repo/requirements_test.txt
      - name: Install Python dependencies
        working-directory: repo
        run: python -m pip install -r requirements_test.txt
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: repo/package-lock.json
      - name: Verify Node tools
        working-directory: repo
        run: |
          npm ci
          npm run test:login-schema
          npm audit --audit-level=moderate
      - name: Format touched test and validate all Python
        working-directory: repo
        run: |
          python -m ruff check --select I --fix tests/test_planner_state_publication.py
          python -m ruff format tests/test_planner_state_publication.py
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy
      - name: Run full regression suite including real HA state publication
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest --junitxml=/tmp/kepco-v037-tests.xml --cov=custom_components.kepco_on --cov-report=term-missing --cov-report=json:/tmp/kepco-v037-coverage.json --cov-fail-under=95 | tee /tmp/kepco-v037-tests.log
      - name: Publish only tested source changes
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md RELEASE_NOTES.md CHANGELOG.md docs/PROTOCOL.md docs/POWER_PLANNER_DIAGNOSTICS.md pyproject.toml custom_components/kepco_on/sensor.py custom_components/kepco_on/const.py custom_components/kepco_on/manifest.json tests/test_api.py tests/test_auth.py tests/test_diagnostics.py tests/test_scaffold.py tests/test_apartment_planner.py tests/test_combined_planner_regression.py tests/test_planner_state_publication.py tests/test_sensor.py
          test "$(git diff --cached --name-only | wc -l)" -eq 17
          git diff --cached > /tmp/kepco-v037.patch
          git commit -m 'fix: retain planner diagnostics for unknown states in v0.3.7'
          git archive --format=zip --output=/tmp/kepco-v037-source.zip HEAD
          git push origin HEAD:refs/heads/fix/kepco-planner-diagnostics-v0.3.7
      - name: Preserve verification results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kepco-v037-verification
          path: |
            /tmp/kepco-v037-tests.xml
            /tmp/kepco-v037-tests.log
            /tmp/kepco-v037-coverage.json
            /tmp/kepco-v037.patch
            /tmp/kepco-v037-source.zip
          retention-days: 7
