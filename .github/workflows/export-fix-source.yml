name: Apply v0.2.1 changes

on:
  push:
    branches:
      - fix/naming-and-sensor-info
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # source: actions/checkout@v7
        with:
          ref: fix/naming-and-sensor-info
          fetch-depth: 0
      - name: Apply v0.2.1 patch
        run: |
          gzip --decompress --stdout .github/v021.patch.gz > /tmp/v021.patch
          git apply --index /tmp/v021.patch
          git rm .github/v021.patch.gz .github/workflows/export-fix-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: align device names and sensor information"
          git push origin HEAD:fix/naming-and-sensor-info
