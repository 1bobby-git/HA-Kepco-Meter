name: Deploy optimization 20260906
on:
  push:
    branches: [release/optimization-20260906]
    paths: [.github/workflows/deploy-optimization-20260906.yml]
permissions:
  contents: write
concurrency:
  group: deploy-optimization-20260906
  cancel-in-progress: false
jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: 1bobby-git/HA-iOS-ANCS
          ref: d5c58703029ea8cfbff4cfd335c59fc49d3fbe98
          path: .release-helper
          sparse-checkout: .optimization-release
          persist-credentials: false
      - name: Load approved patches and correct draft lookup
        run: |
          python - <<'PY'
          import json, os, re, shutil, subprocess
          from pathlib import Path
          original = subprocess.check_output(['git', 'show', '44745c337565d1bb8da8511545df367e0c5f503c:.github/workflows/deploy-optimization-20260906.yml'], text=True)
          spec = json.loads(re.search(r'PATCH_SPEC: >-\s+(\{[^\n]+\})', original).group(1))
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('PATCH_SPEC=' + json.dumps(spec, ensure_ascii=False) + '\n')
          source = Path('.release-helper/.optimization-release')
          text = (source/'deploy.py').read_text()
          old = '    release = api("releases/tags/" + state["tag"])'
          assert text.count(old) == 2
          text = text.replace(old, '    release = next(r for r in api("releases?per_page=100") if r["tag_name"] == state["tag"])', 1)
          Path(os.environ['RUNNER_TEMP'], 'optimization-deploy.py').write_text(text)
          shutil.rmtree('.release-helper')
          PY
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14.4'
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Check source hashes, version and branch protections
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python "$RUNNER_TEMP/optimization-deploy.py" check
      - name: Install Python test requirements
        run: python -m pip install -r requirements_test.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.20.0'
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Run native Node tests and dependency audit
        run: |
          npm run test:login-schema
          npm audit --audit-level=moderate
      - name: Check and test unchanged baseline
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy
          python -m pytest tests/test_ci_metadata.py
          python -m pytest --cov=custom_components.kepco_on --cov-report=term-missing --cov-fail-under=95 --junitxml="$RUNNER_TEMP/optimization-baseline.xml"
      - name: Apply exact source patches and update documentation
        run: python "$RUNNER_TEMP/optimization-deploy.py" apply
      - name: Align package version, release notes and formatting
        run: |
          python - <<'PY'
          import hashlib, json, os, tomllib
          from pathlib import Path
          p = Path('pyproject.toml')
          raw = p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == '310209da103e73e686c148beacad04cade4bc197'
          text = raw.decode()
          old = 'version = "0.3.3"'
          assert text.count(old) == 1
          text = text.replace(old, 'version = "0.3.4"')
          assert tomllib.loads(text)['project']['version'] == '0.3.4'
          p.write_text(text)
          readme = Path('README.md')
          text = readme.read_text()
          old = '- 버전: `v0.3.3`.'
          assert text.count(old) == 1
          readme.write_text(text.replace(old, '- 버전: `v0.3.4`.'))
          notes = Path('RELEASE_NOTES.md')
          assert notes.is_file() and not notes.is_symlink()
          previous_notes = notes.read_text()
          assert previous_notes.startswith('## 한전ON v0.3.3\n')
          document = Path('docs/OPTIMIZATION_2026-09-06.md').read_text()
          notes.write_text('## 한전ON v0.3.4\n' + document.split('\n', 1)[1].rstrip() + '\n\n## 이전 릴리스 참고 (v0.3.3)\n\n' + previous_notes.rstrip() + '\n')
          tests = Path('tests/test_api.py')
          raw = tests.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == '4c99193c199519ac6d9c89cc5e37370667b9af78'
          text = raw.decode()
          old = '"HomeAssistant-KEPCO-ON/0.3.3"'
          assert text.count(old) == 2
          tests.write_text(text.replace(old, '"HomeAssistant-KEPCO-ON/0.3.4"'))
          state_path = Path(os.environ['RUNNER_TEMP']) / 'optimization-state.json'
          state = json.loads(state_path.read_text())
          state['paths'] = sorted(set(state['paths'] + ['pyproject.toml', 'RELEASE_NOTES.md', 'tests/test_api.py']))
          for name in state['paths']:
              if name.endswith('.md'):
                  p = Path(name)
                  p.write_text(p.read_text().rstrip() + '\n')
          state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n')
          PY
          python -m ruff format custom_components/kepco_on/api.py
      - name: Check and test complete patched integration
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy
          python -m pytest tests/test_ci_metadata.py
          python -m pytest --cov=custom_components.kepco_on --cov-report=term-missing --cov-fail-under=95 --junitxml="$RUNNER_TEMP/optimization-patched.xml"
      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa
        with:
          category: integration
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb
      - name: Publish verified commit, tag and release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python "$RUNNER_TEMP/optimization-deploy.py" publish
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optimization-validation
          path: |
            ${{ runner.temp }}/optimization-baseline.xml
            ${{ runner.temp }}/optimization-patched.xml
            ${{ runner.temp }}/optimization-result.json
          if-no-files-found: ignore
