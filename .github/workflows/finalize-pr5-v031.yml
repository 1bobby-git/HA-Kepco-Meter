name: Finalize PR 5 v0.3.1

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: finalize-pr5-v031
  cancel-in-progress: false

jobs:
  finalize:
    name: Finalize residential support release
    runs-on: ubuntu-24.04

    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # source: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Apply reviewed follow-up fixes and documentation
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              if old not in text:
                  raise SystemExit(f"Expected text not found while updating {label}")
              return text.replace(old, new, 1)


          manifest_path = Path("custom_components/kepco_on/manifest.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("version") != "0.3.1":
              print("PR #5 has not been merged yet; no finalization needed.")
              raise SystemExit(0)

          sensor_path = Path("custom_components/kepco_on/sensor.py")
          sensor = sensor_path.read_text(encoding="utf-8")
          sensor = replace_once(
              sensor,
              "KepcoSensorValue = str | int | date | None",
              "KepcoSensorValue = str | int | float | date | None",
              "sensor value type",
          )
          sensor_path.write_text(sensor, encoding="utf-8")

          parser_test_path = Path("tests/test_parser_house.py")
          parser_test = parser_test_path.read_text(encoding="utf-8")
          parser_test = replace_once(
              parser_test,
              "from pathlib import Path\n",
              "from pathlib import Path\nfrom typing import cast\n",
              "house parser test imports",
          )
          parser_test = replace_once(
              parser_test,
              "def _load(name: str) -> dict:\n    return json.loads((FIXTURES / name).read_text(encoding=\"utf-8\"))\n",
              "def _load(name: str) -> dict[str, object]:\n    return cast(\n        \"dict[str, object]\",\n        json.loads((FIXTURES / name).read_text(encoding=\"utf-8\")),\n    )\n",
              "house parser fixture loader",
          )
          parser_test = replace_once(
              parser_test,
              "def test_parse_customers_house_without_si_cust_no_raises() -> None:\n    payload = _load(\"house_customer_list.json\")\n    del payload[\"dlt_myPageAppendList\"][0][\"SI_CUST_NO\"]\n    with pytest.raises(KepcoOnProtocolError):\n        parse_customers(payload, \"uidhash\")\n",
              "def test_parse_customers_house_without_si_cust_no_raises() -> None:\n    payload = _load(\"house_customer_list.json\")\n    rows = payload.get(\"dlt_myPageAppendList\")\n    assert isinstance(rows, list)\n    row = rows[0]\n    assert isinstance(row, dict)\n    del row[\"SI_CUST_NO\"]\n    with pytest.raises(KepcoOnProtocolError):\n        parse_customers(payload, \"uidhash\")\n",
              "house parser missing-customer-number test",
          )
          parser_test_path.write_text(parser_test, encoding="utf-8")

          release_notes = """## 한전ON v0.3.1

### 주택용 직접계약 지원

- `주택용/3kW`처럼 고객 목록에 `CUST_NO`가 없고 `SI_CUST_NO`만 제공되는 개인 계정을 지원합니다.
- 한전ON `mainChart`의 최근 청구 이력을 기존 월별 사용량·청구금액 센서에 연결합니다.
- 최신 청구월의 사용량, 청구금액, 전기 사용 기간 시작일·종료일을 제공합니다.

### 파워플래너 사용량 센서 추가

- `현재 검침기간 누적 사용량`
- `한전 예측 사용량`
- 파워플래너 조회가 일시적으로 실패해도 월별 청구 이력 갱신은 유지합니다.

### 호환성과 제한

- 기존 아파트/오피스텔 단일계약 지원과 기존 엔티티 고유 ID는 유지됩니다.
- 선택 고객마다 5개 논리 기기와 총 34개 센서를 생성합니다.
- 주택용 응답에 없는 아파트 전용 지침·상세 요금·이웃 비교 값은 `unknown`으로 표시될 수 있습니다.
- 파워플래너 값은 한전ON이 제공하는 검침기간 누적·예측 데이터이며 실시간 스마트미터 값은 아닙니다.
- 업데이트 후 Home Assistant Core를 완전히 재시작하세요.

### 기여

주택용 직접계약 지원을 구현하고 실계정에서 검증한 [seojingyo](https://github.com/seojingyo)님의 PR #5를 반영했습니다.

최소 Home Assistant 버전은 2026.8.3입니다.
"""
          Path("RELEASE_NOTES.md").write_text(release_notes, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = replace_once(
              readme,
              "한전ON 개인(`INDI`) 계정의 아파트 세대 전기요금 조회를 Home Assistant 센서와 응답 액션으로 가져오는 비공식 커스텀 통합입니다. 실시간 스마트미터가 아니라 한전ON 청구/검침 페이지에서 확인되는 월별 요금 데이터 기반입니다.",
              "한전ON 개인(`INDI`) 계정의 아파트/오피스텔 단일계약 및 주택용 직접계약 전기요금 조회를 Home Assistant 센서와 응답 액션으로 가져오는 비공식 커스텀 통합입니다. 실시간 스마트미터가 아니라 한전ON 청구/검침 페이지에서 확인되는 월별 요금 데이터 기반입니다.",
              "README introduction",
          )
          readme = replace_once(
              readme,
              "- 지원: 한전ON 개인 계정(`INDI`), 아파트/오피스텔 세대 단일 계약 요금.",
              "- 지원: 한전ON 개인 계정(`INDI`), 아파트/오피스텔 세대 단일계약 및 주택용 직접계약 요금.",
              "README supported scope",
          )
          readme = replace_once(
              readme,
              "- 미지원: 법인 계정, 전기공사업체 계정, 인증서 로그인, OACX 간편인증 자동화, CAPTCHA/MFA 우회, Power Planner 실시간 사용량, CO2 실측값.",
              "- 미지원: 법인 계정, 전기공사업체 계정, 인증서 로그인, OACX 간편인증 자동화, CAPTCHA/MFA 우회, CO2 실측값. 주택용 Power Planner 값은 한전ON의 검침기간 누적·예측 데이터이며 실시간 스마트미터 값이 아닙니다.",
              "README unsupported scope",
          )
          readme = replace_once(
              readme,
              "- 버전: `v0.2.2`. 선택 세대마다 5개 논리 기기와 32개 센서 엔티티를 생성합니다.",
              "- 버전: `v0.3.1`. 선택 고객마다 5개 논리 기기와 34개 센서 엔티티를 생성합니다.",
              "README version summary",
          )
          readme = replace_once(
              readme,
              "3. 조회할 아파트 세대를 선택합니다. 선택 화면에는 개인정보 보호를 위해 아파트명, 동, 호만 표시됩니다.",
              "3. 조회할 고객을 선택합니다. 아파트/오피스텔은 아파트명·동·호를, 주택용 직접계약은 계약 유형과 마스킹된 고객번호만 표시합니다.",
              "README setup selection",
          )
          readme = replace_once(
              readme,
              "`0.2.2`의 `PERSISTED_COOKIE_ALLOWLIST`는 비어 있으므로",
              "현재 버전의 `PERSISTED_COOKIE_ALLOWLIST`는 비어 있으므로",
              "README cookie wording",
          )
          readme = replace_once(
              readme,
              "선택한 아파트 세대마다 다음 5개 논리 기기와 총 32개 센서 엔티티를 생성합니다.",
              "선택한 고객마다 다음 5개 논리 기기와 총 34개 센서 엔티티를 생성합니다.",
              "README sensor count",
          )
          readme = replace_once(
              readme,
              "통합 허브 제목은 `1402동 406호`처럼 선택 세대 위치로 표시하고, 하위 기기 이름은 `월별 사용량`, `검침/전기사용량`, `전기요금`, `이웃 전기사용량 비교`, `온실가스 배출량`으로만 표시합니다. 동·호의 앞자리 0은 표시 단계에서 제거합니다. 사용자가 설정 과정에서 별도 표시 이름을 입력한 경우에는 해당 이름을 유지합니다.",
              "아파트/오피스텔 통합 허브 제목은 `1402동 406호`처럼 선택 세대 위치로 표시하고, 주택용 직접계약은 계약 유형과 마스킹된 고객번호를 사용합니다. 하위 기기 이름은 `월별 사용량`, `검침/전기사용량`, `전기요금`, `이웃 전기사용량 비교`, `온실가스 배출량`으로만 표시합니다. 동·호의 앞자리 0은 표시 단계에서 제거합니다. 사용자가 설정 과정에서 별도 표시 이름을 입력한 경우에는 해당 이름을 유지합니다.",
              "README hub labels",
          )
          readme = replace_once(
              readme,
              "### 검침/전기사용량 · 10개",
              "### 검침/전기사용량 · 12개",
              "README meter sensor count",
          )
          readme = replace_once(
              readme,
              "| 전년동월 사용량 | 612 kWh |\n",
              "| 전년동월 사용량 | 612 kWh |\n| 현재 검침기간 누적 사용량 | 509.783 kWh |\n| 한전 예측 사용량 | 636.263 kWh |\n",
              "README Power Planner table rows",
          )
          readme = replace_once(
              readme,
              "나머지 7개 엔티티는 `센서` 영역에 표시합니다.",
              "나머지 9개 엔티티는 `센서` 영역에 표시합니다.",
              "README meter area count",
          )
          readme = replace_once(
              readme,
              "한전ON이 `당월 세대 사용량`과 `당월 공용 사용량`을 모두 비워서 반환하면 전체 사용량을 세대 사용량으로, 공용 사용량을 `0 kWh`로 보정합니다. 한쪽 또는 양쪽의 실제 값이 있으면 한전ON 원본 값을 우선 사용하고 필요한 한쪽만 전체 사용량과의 차이로 계산합니다.",
              "한전ON이 `당월 세대 사용량`과 `당월 공용 사용량`을 모두 비워서 반환하면 전체 사용량을 세대 사용량으로, 공용 사용량을 `0 kWh`로 보정합니다. 한쪽 또는 양쪽의 실제 값이 있으면 한전ON 원본 값을 우선 사용하고 필요한 한쪽만 전체 사용량과의 차이로 계산합니다.\n\n`현재 검침기간 누적 사용량`과 `한전 예측 사용량`은 주택용 직접계약의 Power Planner 응답에서 제공합니다. 아파트/오피스텔 계정이나 한전ON이 값을 제공하지 않는 계정에서는 `unknown`으로 표시될 수 있습니다.",
              "README Power Planner explanation",
          )
          readme = replace_once(
              readme,
              "Energy Dashboard에는 `당월지침` 센서를 전력 사용량 소스로 추가합니다. 이 센서는 누적 검침값이며 `total_increasing` 상태 클래스를 사용합니다. 월별 사용량과 비교 사용량 센서는 한 달 단위 값이므로 누적 소스로 사용하지 않습니다.",
              "Energy Dashboard에는 `당월지침` 센서를 전력 사용량 소스로 추가합니다. 이 센서는 누적 검침값이며 `total_increasing` 상태 클래스를 사용합니다. 월별 사용량과 비교 사용량 센서는 한 달 단위 값이므로 누적 소스로 사용하지 않습니다. 주택용 직접계약 응답에는 누적 지침값이 없으므로 `당월지침`이 `unknown`이면 Energy Dashboard 소스로 사용할 수 없습니다.",
              "README Energy Dashboard limitation",
          )
          readme = replace_once(
              readme,
              "`v0.2.1`에서 `v0.2.2`로 업그레이드하면 전기요금 기기의 10개 엔티티가 표의 전체 이름으로 표시됩니다. 기존 엔티티 ID와 unique ID는 유지됩니다. 업데이트 후 Home Assistant Core를 완전히 재시작하세요.",
              "`v0.2.1`에서 `v0.2.2`로 업그레이드하면 전기요금 기기의 10개 엔티티가 표의 전체 이름으로 표시됩니다. 기존 엔티티 ID와 unique ID는 유지됩니다. `v0.3.1`부터 주택용 직접계약과 Power Planner 센서 2개를 지원하며, 기존 아파트/오피스텔 엔티티 고유 ID는 유지됩니다. 업데이트 후 Home Assistant Core를 완전히 재시작하세요.",
              "README upgrade path",
          )
          readme = replace_once(
              readme,
              "`kepco_on.get_monthly_bill`은 지정 월의 한 고객 청구 상세를 반환합니다.",
              "`kepco_on.get_monthly_bill`은 한 고객의 청구 상세를 반환합니다. 아파트/오피스텔은 지정 월을 조회하고, 주택용 직접계약은 한전ON `mainChart`가 제공하는 최신 청구 이력을 사용합니다.",
              "README monthly bill action",
          )
          readme_path.write_text(readme, encoding="utf-8")

          for json_path in (
              manifest_path,
              Path("custom_components/kepco_on/strings.json"),
              Path("custom_components/kepco_on/translations/en.json"),
              Path("custom_components/kepco_on/translations/ko.json"),
          ):
              data = json.loads(json_path.read_text(encoding="utf-8"))
              json_path.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )

          workflow_path = Path(".github/workflows/finalize-pr5-v031.yml")
          workflow_path.unlink()
          PY

          if git diff --quiet; then
            echo "No release finalization changes were needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize v0.3.1 residential support release"
          git push origin HEAD:main
