name: Temporary v0.3.10 test alignment

on:
  push:
    branches:
      - fix/session-persistence-0.3.10

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v0310-test-align]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Align stale tests
        run: python scripts/align_v0310_tests.py
      - name: Commit aligned tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git diff --cached --check
          git commit -m "test: align v0.3.10 session expectations [v0310-test-align]"
          git push
