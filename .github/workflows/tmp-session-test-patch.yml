name: Temporary session test patch

on:
  push:
    branches:
      - fix/session-persistence-0.3.10

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[session-test-autofix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch stale session tests
        run: |
          python - <<'PY'
          from pathlib import Path

          for filename in ("tests/test_api.py", "tests/test_auth.py"):
              path = Path(filename)
              text = path.read_text()
              text = text.replace(
                  "HomeAssistant-KEPCO-ON/0.3.9",
                  "HomeAssistant-KEPCO-ON/0.3.10",
              )
              path.write_text(text)

          path = Path("tests/test_auth.py")
          text = path.read_text()
          old = "    assert based_on_current_baseline.cookies == ()"
          new = """    assert len(based_on_current_baseline.cookies) == 1
              persisted_cookie = based_on_current_baseline.cookies[0]
              assert persisted_cookie.name == \"JSESSIONID\"
              assert persisted_cookie.value == \"rotated-cookie\"
              assert persisted_cookie.domain == \"online.kepco.co.kr\"
              assert persisted_cookie.path == \"/\"
              assert persisted_cookie.expires_at is None"""
          if old not in text:
              raise SystemExit("cookie assertion not found")
          path.write_text(text.replace(old, new))
          PY
      - name: Commit test updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_api.py tests/test_auth.py
          git diff --cached --check
          git commit -m "test: update session persistence expectations [session-test-autofix]"
          git push
