name: Apply five-sensor update

on:
  push:
    branches:
      - feature/five-sensor-devices
    paths:
      - .github/five-sensor-update.ready

permissions:
  contents: write

jobs:
  apply:
    name: Apply prepared source patch
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # source: actions/checkout@v7
        with:
          ref: feature/five-sensor-devices
          fetch-depth: 0

      - name: Apply, verify, and commit source changes
        shell: bash
        run: |
          set -euo pipefail
          cat .github/five-sensor-update.patch.b64.part-* | base64 --decode > /tmp/five-sensor-update.patch
          git apply --index /tmp/five-sensor-update.patch
          rm .github/five-sensor-update.patch.b64.part-*
          rm .github/five-sensor-update.ready
          rm .github/workflows/export-source.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: reorganize KEPCO sensors into five devices"
          git push origin HEAD:feature/five-sensor-devices
