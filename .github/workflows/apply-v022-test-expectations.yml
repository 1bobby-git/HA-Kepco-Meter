name: Align v0.2.2 regression expectations

on:
  push:
    branches:
      - fix/charge-entity-names-v022-final
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # source: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Update version and translation expectations
        run: |
          python - <<'PY'
          from pathlib import Path


          def replace_exact(path: Path, old: str, new: str, expected_count: int = 1) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected_count:
                  raise RuntimeError(
                      f"{path}: expected {expected_count} occurrences of {old!r}, found {count}"
                  )
              path.write_text(text.replace(old, new), encoding="utf-8")


          root = Path(".")
          replace_exact(
              root / "tests/test_api.py",
              "HomeAssistant-KEPCO-ON/0.2.1",
              "HomeAssistant-KEPCO-ON/0.2.2",
              2,
          )
          replace_exact(
              root / "tests/test_auth.py",
              "HomeAssistant-KEPCO-ON/0.2.1",
              "HomeAssistant-KEPCO-ON/0.2.2",
          )
          replace_exact(
              root / "tests/test_diagnostics.py",
              '"version": "0.2.1"',
              '"version": "0.2.2"',
          )
          replace_exact(
              root / "tests/test_scaffold.py",
              '"version": "0.2.1"',
              '"version": "0.2.2"',
          )
          replace_exact(
              root / "tests/test_scaffold.py",
              'const.VERSION == "0.2.1"',
              'const.VERSION == "0.2.2"',
          )

          sensor_test = root / "tests/test_sensor.py"
          sensor_replacements = {
              '"electricity_subtotal": {"name": "전기요금 계"},':
                  '"electricity_subtotal": {"name": "전기요금\\u00a0계"},',
              '"base_charge": {"name": "전기요금 상세 기본요금"},':
                  '"base_charge": {"name": "전기요금\\u00a0상세 기본요금"},',
              '"energy_charge": {"name": "전기요금 상세 전력량요금"},':
                  '"energy_charge": {"name": "전기요금\\u00a0상세 전력량요금"},',
              '"climate_environment_charge": {"name": "전기요금 상세 기후환경요금"},':
                  '"climate_environment_charge": {"name": "전기요금\\u00a0상세 기후환경요금"},',
              '"fuel_adjustment_charge": {"name": "전기요금 상세 연료비조정요금"},':
                  '"fuel_adjustment_charge": {"name": "전기요금\\u00a0상세 연료비조정요금"},',
              '"child_discount": {"name": "전기요금 상세 출산가구할인요금"},':
                  '"child_discount": {"name": "전기요금\\u00a0상세 출산가구할인요금"},',
          }
          for old, new in sensor_replacements.items():
              replace_exact(sensor_test, old, new)
          PY

          rm .github/workflows/apply-v022-test-expectations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test: align expectations with v0.2.2"
          git push origin HEAD:${{ github.ref_name }}
